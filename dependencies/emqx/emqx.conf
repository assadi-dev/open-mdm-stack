## Open MDM — EMQX broker configuration (replaces the image's default emqx.conf).
##
## Transport for remote commands and device presence. Postgres stays the source
## of truth; the broker only carries messages.
##
## Topics (per device, {id} = device UUID = MQTT clientid):
##   mdm/devices/{id}/commands  server -> device  (QoS 1)
##   mdm/devices/{id}/acks      device -> server  (command results)
##   mdm/devices/{id}/status    device -> server  ("online"/"offline", retained, Last Will)
##   mdm/devices/{id}/screen    device -> server  (lock-screen state, retained, reported on change)

node {
  name = "emqx@127.0.0.1"
  cookie = "openmdm-dev-cookie"
  data_dir = "data"
}

cluster {
  name = openmdm
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

## Every CONNECT is delegated to the API, which accepts either:
##  - the backend superuser (username/password from MQTT_BACKEND_*), or
##  - a device: clientid = device id, password = its device JWT (must be enrolled).
## The API runs on the host (nodemon), hence host.docker.internal. Keep the port
## in sync with PORT in apps/api/.env.
authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://host.docker.internal:5573/api/v1/mqtt/auth"
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    headers {
      "content-type" = "application/json"
    }
    connect_timeout = "5s"
    request_timeout = "5s"
    pool_size = 8
  }
]

## Devices may only touch their own subtree; anything unmatched is denied.
## The backend is superuser and bypasses these rules.
authorization {
  no_match = deny
  deny_action = disconnect
  cache {
    enable = true
  }
  sources = [
    {
      type = file
      enable = true
      path = "etc/acl.conf"
    }
  ]
}

mqtt {
  ## Commands queued for an offline device (persistent session) survive 1 day.
  session_expiry_interval = "1d"
  max_mqueue_len = 100
}
