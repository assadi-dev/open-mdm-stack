name: ${CONTAINER_NAME:-openmdm-stack}

services:
  maildev:
    restart: unless-stopped
    image: maildev/maildev:latest
    ports:
      - "1080:1080"
      - "1025:1025"

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    ports:
      - "${S3_PORT}:9000"
      - "${S3_UI_PORT}:9001"
    volumes:
      - ./volumes/rustfs-data:/data
    environment:
      - RUSTFS_ACCESS_KEY
      - RUSTFS_SECRET_KEY
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
    command: /data

  postgres:
    image: pgvector/pgvector:${DB_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./volumes/db-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8336:80"
    depends_on:
      - postgres

  # Broker MQTT : commandes à distance + présence des devices.
  # Auth déléguée à l'API (POST /api/v1/mqtt/auth), ACL par device dans acl.conf.
  # 5.8.6 = dernière version Apache-2.0 (5.9+ passe sous BSL).
  emqx:
    image: emqx/emqx:5.8.6
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-8083}:8083"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./volumes/emqx-data:/opt/emqx/data
    extra_hosts:
      # Permet au conteneur de joindre l'API lancée sur l'hôte (Linux inclus).
      - "host.docker.internal:host-gateway"

  # Canvas server du MCP Excalidraw (UI + REST + WebSocket) que Claude pilote.
  # Mappé sur 5000 (le canvas écoute sur 3000 en interne, déjà pris par apps/web).
  excalidraw:
    image: ghcr.io/yctimlin/mcp_excalidraw-canvas:latest
    restart: unless-stopped
    ports:
      - "5000:3000"
